<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="買い物メモ">
  <meta name="theme-color" content="#4ecca3">
  <title>買い物メモ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ヘッダー -->
  <header>
    <h1>🛒 買い物メモ</h1>
    <div class="header-actions">
      <button id="done-btn" class="icon-btn" title="チェック解除">↩</button>
      <button id="clear-btn" class="icon-btn" title="クリア">🗑</button>
      <button id="settings-btn" class="icon-btn" title="設定">⚙</button>
    </div>
  </header>

  <!-- カウンター -->
  <div class="counter">
    <span id="counter">0 件</span><span id="done-count"></span>
    <span id="sync-status" class="sync-status"></span>
  </div>

  <!-- リスト -->
  <div id="list-container">
    <div id="item-list"></div>
    <div id="empty-state" class="empty-state">
      <div class="icon">🛒</div>
      <p>マイクボタンを押して<br>買うものを話してください</p>
    </div>
  </div>

  <!-- 音声入力エリア -->
  <div class="mic-area">
    <div id="mic-hint" class="mic-hint">タップして音声入力</div>
    <button id="mic-btn">🎤</button>
    <div class="manual-input-row">
      <input id="manual-input" type="text" placeholder="テキスト入力…" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="add-btn">追加</button>
    </div>
  </div>

</div>

<!-- 設定パネル -->
<div id="settings-overlay" class="settings-overlay"></div>
<div id="settings-panel" class="settings-panel">
  <div class="settings-header">
    <h2>⚙ 設定</h2>
    <button id="settings-close" class="icon-btn">✕</button>
  </div>

  <div class="settings-section">
    <h3>🔗 ウィジェット連携（GitHub Gist）</h3>
    <p class="settings-desc">設定するとホーム画面・ロック画面のウィジェットにリストを表示できます。</p>

    <label class="settings-label">GitHub Personal Access Token</label>
    <div class="pat-input-row">
      <input type="password" id="pat-input" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" spellcheck="false">
      <button id="pat-toggle" class="icon-btn" title="表示切替">👁</button>
    </div>
    <p class="settings-hint">※ <a href="https://github.com/settings/tokens/new?scopes=gist" target="_blank">こちらで作成</a>（gistスコープのみ選択）</p>

    <button id="pat-save" class="btn-full btn-accent-full">保存して同期</button>

    <div id="gist-info" class="gist-info" style="display:none">
      <label class="settings-label">Gist ID（ウィジェット設定用）</label>
      <div class="gist-id-row">
        <span id="gist-id-display" class="gist-id-text"></span>
        <button id="gist-id-copy" class="icon-btn" title="コピー">📋</button>
      </div>
    </div>
  </div>

  <div class="settings-section">
    <h3>📱 Scriptable ウィジェット</h3>
    <p class="settings-desc">
      1. App Store で <strong>Scriptable</strong> をインストール<br>
      2. 下のボタンでスクリプトをダウンロード<br>
      3. Scriptable にスクリプトを追加<br>
      4. ウィジェット長押し →「パラメータを編集」に Gist ID を入力
    </p>
    <button id="widget-dl" class="btn-full btn-outline-full">📥 widget.js をダウンロード</button>
  </div>
</div>

<!-- 確認モーダル -->
<div id="modal" class="modal-overlay">
  <div class="modal">
    <h3>確認</h3>
    <p id="modal-msg"></p>
    <div class="modal-btns">
      <button id="modal-cancel" class="btn-cancel">キャンセル</button>
      <button id="modal-ok"     class="btn-danger">削除</button>
    </div>
  </div>
</div>

<!-- トースト -->
<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
